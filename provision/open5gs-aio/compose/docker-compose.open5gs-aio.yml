# Monolithic Open5GS 5G core (one `5gc` process running every NF in-process).
# Uses the locally-built skillful-ran/open5gs:v2.7.0 image AS-DESIGNED:
# its entrypoint creates the 127.0.0.x dummy interfaces each NF binds to,
# spawns an internal mongod, envsubst's the YAML template, seeds the
# default subscriber from the SUBSCRIBER_DB env var, then exec's the
# 5gc binary which spawns every NF in-process. SCP routing is internal.
#
# This is an ALTERNATIVE to the split-NF stack under benchmark/provision/open5gs-core/
# -- pick ONE per session; both bind AMF SCTP 38412 on the host.
#
# Use this stack when running the OCUDU gNB + srsUE attach smoke
# (benchmark/provision/ocudu-gnb-ue/). The split-NF stack is the
# live_core adapter target (per-NF restart granularity).
#
# Bring up:  docker compose -f docker-compose.open5gs-aio.yml up -d
# Verify:    bash ../tests/check_aio_ready.sh
# Tear down: docker compose -f docker-compose.open5gs-aio.yml down -v
#
# Image dependency: skillful-ran/open5gs:v2.7.0 is a LOCALLY BUILT image
# on 5090pc (~3.25 GB). Portable rebuild from upstream Open5GS source is
# a follow-up.

name: open5gs

networks:
  ran:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24

services:

  5gc:
    image: skillful-ran/open5gs:v2.7.0
    container_name: open5gs-5gc
    restart: unless-stopped
    pull_policy: missing
    privileged: true
    networks:
      ran:
        ipv4_address: 10.53.1.2
    ports:
      - "38412:38412/sctp"
    volumes:
      # Mount as .yml.in so the image's entrypoint runs envsubst on it
      # (substituting ${OPEN5GS_IP}, ${UE_IP_BASE}, ${MONGODB_IP}, etc.).
      - ./configs/open5gs-5gc.yml.in:/open5gs/open5gs-5gc.yml.in:ro
    environment:
      OPEN5GS_IP: "10.53.1.2"
      UPF_ADVERTISE_IP: "10.53.1.2"
      MONGODB_IP: "127.0.0.1"
      UE_IP_BASE: "10.45.0"
      NETWORK_NAME_FULL: "Open5GS"
      NETWORK_NAME_SHORT: "Open5GS"
      DEBUG: "false"
      # SUBSCRIBER_DB format (per the image's add_users.py):
      #   IMSI,K,OPc,OPc_value,AMF_value,QCI,UE_IP
      # Match what UE conf in benchmark/provision/ocudu-gnb-ue/compose/configs/ue_zmq.conf
      # advertises: IMSI=001010000000001, K=00112233445566778899aabbccddeeff,
      # OPc=63bfa50ee6523365ff14c1f45f88737d, AMF=8000, QCI=9, UE_IP=10.45.0.2.
      SUBSCRIBER_DB: "001010000000001,00112233445566778899aabbccddeeff,opc,63bfa50ee6523365ff14c1f45f88737d,8000,9,10.45.0.2"
    command: ["5gc", "-c", "/open5gs/open5gs-5gc.yml"]
    healthcheck:
      # Internal mongod takes a few seconds to come up + the NF startup
      # cascade. SCTP 38412 binding is the canonical "AMF up" signal.
      test: ["CMD-SHELL", "ss -ln | grep -q :38412"]
      interval: 5s
      timeout: 3s
      retries: 30
