# OCUDU gNB — software-only ZMQ build, talking to:
#   * AMF at 10.53.1.2:38412 inside the open5gs_ran docker network
#   * srsUE peer at 10.53.1.21 via ZMQ tx/rx ports 2000/2001
#
# Adapted from the validated OCUDU ZMQ reference for B210/FDD/srsUE.
# PLMN / TAC / SST aligned with benchmark/provision/open5gs-core/configs/amf.yaml
# (PLMN 00101, TAC 1, SST 1).

cu_cp:
  amf:
    addrs: 10.53.1.2
    port: 38412
    bind_addrs: 10.53.1.20
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: zmq
  # gnb listens on tcp://*:2000 (UE will rx from 10.53.1.20:2000),
  # gnb rx connects to UE's tx endpoint at 10.53.1.21:2001.
  device_args: tx_port=tcp://*:2000,rx_port=tcp://10.53.1.21:2001,base_srate=23.04e6
  clock: default
  srate: 23.04
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 1
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: disable
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: enable
  ngap_filename: /tmp/gnb_ngap.pcap

# Remote control WebSocket on 0.0.0.0:8001 inside the container, exposed
# to the host via compose ports. Consumed by the live_ocudu adapter.
remote_control:
  enabled: true
  bind_addr: 0.0.0.0
  port: 8001

# Metrics streamed to remote_control subscribers as JSON frames (the
# live_ocudu adapter uses metrics_subscribe to read evidence). Also
# emit to stdout for human debugging.
metrics:
  autostart_stdout_metrics: true
  enable_json: true

# E2 agent → nearRT-RIC at 10.53.1.30:36421 (FlexRIC service on the same
# open5gs_ran network). The live_e2 adapter reads decoded KPM v05
# indications from the RIC container's /var/log/flexric/kpm.jsonl.
# DU/CU-CP/CU-UP all advertised + KPM and RC service models enabled.
e2:
  enable_cu_cp_e2: true
  enable_cu_up_e2: true
  enable_du_e2: true
  addrs: 10.53.1.30
  port: 36421
  bind_addrs: 10.53.1.20
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true
