# srsUE -- software-only ZMQ build, paired with the OCUDU gNB peer at
# 10.53.1.20 (gnb tx=2000 / rx=2001) on the open5gs_ran docker network.
#
# IMSI/K/OPc match the seeded subscriber in
# benchmark/provision/open5gs-core/compose/seed/subscriber_db.csv.
# APN matches the SMF DNN in
# benchmark/provision/open5gs-core/configs/smf.yaml (internet).

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = zmq
# UE listens on tcp://*:2001 (gnb will rx from 10.53.1.21:2001),
# UE rx connects to gnb's tx endpoint at 10.53.1.20:2000.
device_args = tx_port=tcp://*:2001,rx_port=tcp://10.53.1.20:2000,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 001010000000001
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = internet
apn_protocol = ipv4

[gw]
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
