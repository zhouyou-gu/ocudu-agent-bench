# FlexRIC nearRT-RIC service for E2 observation (and later, E2 control).
# Joins the existing open5gs_ran docker network so the OCUDU gNB at 10.53.1.20
# can reach the RIC's E2 listener at SCTP 36421.
#
# The image is purpose-built for OCUDU KPM v05: when FLEXRIC_KPM_V05_JSONL is
# set, the RIC's KPM indication decoder appends decoded JSONL records to that
# path. We bind-mount that path to the host so the live_e2 adapter can read it.
#
# Bring up:  docker compose -f docker-compose.flexric.yml up -d
# Tear down: docker compose -f docker-compose.flexric.yml down
#
# Prerequisites:
#   1. AIO open5gs core OR split-NF core is already up (the gNB needs to
#      attach to AMF before E2 setup makes sense to test end-to-end).
#   2. OCUDU gNB compose is up (and its gnb_zmq.yaml has the e2: block set
#      to addrs: 10.53.1.30 + enable_du_e2 + e2sm_kpm_enabled).
#
# Image dep: skillful-ran/flexric-bench:br-flexric-1a3903a7-kpm-v5-ocudu-26_04
# (locally built on 5090pc; ~1.37 GB). See OCUDU_KPM_V05.md inside the image
# for the build recipe.

name: flexric

networks:
  ran:
    external: true
    name: open5gs_ran

services:
  flexric:
    image: skillful-ran/flexric-bench:br-flexric-1a3903a7-kpm-v5-ocudu-26_04
    container_name: flexric-ric
    pull_policy: missing
    restart: "no"
    networks:
      ran:
        ipv4_address: 10.53.1.30
    volumes:
      # Custom ric.conf binds on 0.0.0.0 so the gNB (outside the container)
      # can reach the E2 listener.
      - ./configs/ric.conf:/usr/local/etc/flexric/flexric.conf:ro
      # Custom xApp ORAN-SM subscription config: only OCUDU-DU-advertised
      # measurements (RRU.PrbAvail/Used/TotDl/Ul + a few DRB.*). The stock
      # xapp_oran_sm.conf requests DRB.PdcpSduVolume[DL|UL] which are
      # CU-UP measurements; we disable the CU-UP E2 agent so those don't
      # show up and the subscription would fail (which would crash this
      # FlexRIC build via an unimplemented failure-handler assertion).
      - ./configs/xapp_oran_sm.conf:/etc/xapp/xapp_oran_sm.conf:ro
      # JSONL output dir for decoded OCUDU KPM v05 indications. The RIC
      # appends one JSON object per indication (the env var below makes
      # the patched KPM decoder do this).
      - flexric-kpm:/var/log/flexric
    environment:
      FLEXRIC_KPM_V05_JSONL: "/var/log/flexric/kpm.jsonl"
    # Run the RIC + a continuously-restarted monitor xApp.
    # Sequence:
    #   1. start nearRT-RIC in the background
    #   2. in a background sub-shell: wait for an E2 SETUP-REQUEST in the
    #      RIC log (gNB has connected), then loop forever starting the
    #      xApp (which issues the KPM subscription that makes the gNB
    #      emit indications). If the xApp ever exits (it's a test binary
    #      that may exit after some indications), restart it after 5s so
    #      the subscription is re-established and JSONL keeps flowing.
    #   3. wait only on the RIC PID -- the container stays alive as long
    #      as the RIC is alive; xApp churn doesn't shut it down.
    command:
      - /bin/sh
      - -c
      - |
        flexric-ric -c /usr/local/etc/flexric/flexric.conf > /tmp/ric.log 2>&1 &
        RIC_PID=$$!
        (
          DEADLINE=$$(( $$(date +%s) + 120 ))
          while [ "$$(date +%s)" -lt "$$DEADLINE" ]; do
            grep -q "SETUP-REQUEST from" /tmp/ric.log && break
            sleep 2
          done
          while kill -0 $$RIC_PID 2>/dev/null; do
            /usr/local/bin/flexric/xApp/c/xapp_oran_moni -c /etc/xapp/xapp_oran_sm.conf >> /tmp/xapp.log 2>&1
            sleep 5
          done
        ) &
        wait $$RIC_PID

volumes:
  flexric-kpm: {}
