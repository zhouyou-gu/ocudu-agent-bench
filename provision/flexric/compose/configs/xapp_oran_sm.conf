# Custom OCUDU-compatible xApp ORAN SM subscription config.
# Drops the stock xapp_oran_sm.conf's DRB.PdcpSduVolume[DL|UL] entries:
# those are CU-UP measurements, and we intentionally disable the OCUDU
# CU-UP E2 agent (its E2 SETUP carries an E1 component type that this
# FlexRIC build asserts against — see
# benchmark/provision/ocudu-gnb-ue/compose/configs/gnb_zmq.yaml e2: block).
#
# Remaining measurements are all advertised by OCUDU's DU KPM provider per
# ocudu/lib/e2/e2sm/e2sm_kpm/e2sm_kpm_du_meas_provider_impl.cpp
# (supported_metrics.emplace lines).

SM_DIR = "/usr/local/lib/flexric/"

Name = "xApp"
NearRT_RIC_IP = "127.0.0.1"
E42_Port = 36422

Sub_ORAN_SM_List = (
    { name = "KPM", time = 1000,
      format = 1,
      ran_type = "ngran_gNB_DU",
      actions = (
            { name = "RRU.PrbAvailDl" },
            { name = "RRU.PrbUsedDl" },
            { name = "RRU.PrbTotDl" }
            )
    }
)

# Live-tested 2026-05-25: the 3-DL-measurement gNB_DU subscription above
# is accepted by OCUDU's KPM v05 DU provider and JSONL records start
# flowing immediately. Adding any UL variant (RRU.PrbAvailUl /
# PrbUsedUl / PrbTotUl) or any DRB.* measurement causes the gNB to
# reject the subscription, which crashes this FlexRIC build via the
# unimplemented e2ap_handle_subscription_failure_ric assertion.
#
# A standalone ngran_gNB-scope block requesting RRU.PrbTotDl +
# RRU.PrbTotUl was accepted at the RIC level but did not produce any
# JSONL output (the KPM v05 decoder is DU-scoped).
#
# Future work: extend OCUDU's DU KPM provider to advertise UL
# measurements + DRB.* metrics, OR patch FlexRIC's subscription
# failure handler so failed actions can be dropped without crashing
# the RIC.
