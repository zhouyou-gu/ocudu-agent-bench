# nearRT-RIC config, customized from the stock /opt/flexric/conf_files/ric.conf
# in skillful-ran/flexric-bench:br-flexric-1a3903a7-kpm-v5-ocudu-26_04.
# Bind on 0.0.0.0 so the OCUDU gNB (on the same docker network) can reach the
# E2 listener at SCTP 36421. xApp port stays loopback (no host xApp yet).

SM_DIR = "/usr/local/lib/flexric/"

# supported name = NearRT_RIC, E2_Agent, E2_Proxy_Agent, xApp
Name = "NearRT_RIC"
NearRT_RIC_IP = "0.0.0.0"
E2_Port = 36421
E42_Port = 36422
